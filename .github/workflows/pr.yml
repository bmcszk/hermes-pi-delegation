name: pr

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # astral-sh/setup-uv v5.4.2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
      - name: ruff
        run: uvx ruff check .
      - name: ruff format
        run: uvx ruff format --check .
      - name: function-length (CFQ001)
        run: uv run --with flake8 --with flake8-functions python -m flake8 --select=CFQ001 --max-function-length=100 .
      - name: file-length (pylint too-many-lines)
        run: uv run --with pylint python -m pylint --disable=all --enable=too-many-lines --max-module-lines=1000 --score=n __init__.py scripts tests
      - name: pytest
        run: uv run --with pytest python -m pytest tests -q
      - name: byte-compile
        run: python -m compileall -q __init__.py scripts tests

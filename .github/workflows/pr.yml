name: pr

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # astral-sh/setup-uv v5.4.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true
      - name: ruff
        run: uvx ruff check .
      - name: pytest
        run: uv run --with pytest python -m pytest tests -q
      - name: byte-compile
        run: python -m compileall -q __init__.py scripts tests
